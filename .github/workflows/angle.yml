name: ANGLE

# Builds the ANGLE native binaries (libEGL + libGLESv2) for every supported platform and commits
# them into native/Maxine.Silk.OpenGLES.ANGLE.Native/runtimes/<rid>/native, from where the NuGet
# package picks them up.
#
# The binaries are committed rather than uploaded as artefacts because "pack" reads them straight
# out of the working tree. ANGLE takes a long time to build, so this runs on manual dispatch and
# on changes to the build script, not on every commit.

on:
    workflow_dispatch:
    push:
        branches:
            - main
        paths:
            - build/nuke/Native/Angle.cs
            - build/nuke/Build.Support.cs
            - build/nuke/Build.cs
            - .github/workflows/angle.yml

concurrency:
    # ANGLE builds push to the branch they run on, so overlapping runs on the same ref would race
    # to push. Cancel the older one.
    group: angle-${{ github.ref }}
    cancel-in-progress: true

permissions: 
  contents: write

jobs:
    Build:
        strategy:
            fail-fast: false
            matrix:
                include:
                    - os: ubuntu-22.04
                      name: Linux
                      nuke_invoke: ./build.sh
                      runtimes: linux-x64
                      target_cpu: x64
                    # Linux arm64 is cross-compiled from the x64 runner rather than built on an
                    # arm64 one, which is the opposite of what the -arm runners are for and of what
                    # Windows below does. Building it natively does not work: Chromium publishes a
                    # clang for x64 Linux, Mac, Mac arm64 and Windows and nothing else
                    # (tools/clang/scripts/update.py: _HOST_OS_URL_MAP has no linux-arm64 entry), so
                    # an arm64 host downloads an x64 clang and dies the moment it runs it, with
                    #   fork/exec .../llvm-build/Release+Asserts/bin/clang++: exec format error
                    # Chromium's own answer is to cross-compile -- docs/linux/chromium_arm.md calls
                    # it "the recommended method of building for ARM", and its bots "run x86-64 linux
                    # and cross-compile the ARM targets" -- and the x64 runner has the working clang
                    # for it. Everything comes from current_cpu, with no host check anywhere in
                    # build/config: target_cpu selects the clang_arm64 toolchain, and
                    # compiler_cpu_abi.gn adds --target=aarch64-linux-gnu to the x64 clang.
                    - os: ubuntu-22.04
                      name: Linux ARM64
                      nuke_invoke: ./build.sh
                      runtimes: linux-arm64
                      target_cpu: arm64
                    # One job per architecture, not one job building both. gn takes a single
                    # target_cpu at a time, so x64 and x86 in one job is gn gen and ninja run twice
                    # over, back to back, on the same four cores; split across runners they run at
                    # the same time on eight. The architecture the job builds is named here rather
                    # than inferred from the runner, because the runner no longer implies it -- the
                    # arm64 sysroots ANGLE ships are x86 and x64 only, so x86 has to be
                    # cross-compiled from an x64 host and never from an arm64 one.
                    - os: windows-2022
                      name: Windows x64
                      nuke_invoke: ./build.cmd
                      runtimes: win-x64
                      target_cpu: x64
                    - os: windows-2022
                      name: Windows x86
                      nuke_invoke: ./build.cmd
                      runtimes: win-x86
                      target_cpu: x86
                    - os: windows-11-arm
                      name: Windows ARM64
                      nuke_invoke: ./build.cmd
                      runtimes: win-arm64
                      target_cpu: arm64
                    - os: macos-26
                      name: Darwin
                      nuke_invoke: ./build.sh
                      runtimes: osx
        name: ${{ matrix.name }} Build
        runs-on: ${{ matrix.os }}
        steps:
            - uses: actions/checkout@v4
              with:
                  # The build commits the binaries it produces, so it needs a token that can push.
                  token: ${{ github.token }}

            # ANGLE's dependency tree plus its GN/ninja output does not fit in the ~14 GB the
            # ubuntu images leave free. It runs out partway through `fetch`, on the first CIPD
            # package, with "no space left on device" -- nowhere near enough of the tree checked out
            # to make sense of the error. Reclaim the space first: this drops the preinstalled
            # Android SDK, two browsers, the Haskell/CodeQL toolchains and the swap file, none of
            # which this build uses (it compiles C++ with ANGLE's own clang and needs only .NET and
            # Python, both installed explicitly below).
            - name: Free disk space
              if: startsWith(matrix.os, 'ubuntu')
              uses: jlumbroso/free-disk-space@v1.3.2
              with:
                  android: true
                  dotnet: true
                  haskell: true
                  large-packages: true
                  swap-storage: true
                  tool-cache: true

            # ANGLE vendors Chromium's build/ directory, and build/toolchain/win/setup_toolchain.py
            # pins the Windows SDK to build against: SDK_VERSION = '10.0.28000.0'. It passes that to
            # vcvarsall.bat and then requires every INCLUDE path that comes back to exist, so with
            # any other SDK installed `gn gen` dies with
            #   Path "C:\Program Files (x86)\Windows Kits\10\\include\10.0.28000.0\\um" from
            #   environment variable "include" does not exist.
            # No runner image ships 28000 -- windows-2022, windows-2025 and both VS2026 preview
            # images all stop at 10.0.26100.0 -- because it is an Insider preview SDK. Build against
            # a different one is not an option: 26100's fileapi.h reaches FILE_INFO_BY_HANDLE_CLASS
            # before it is declared, so compilation fails with "unknown type name". Install the
            # version ANGLE actually asks for. Both desktop C++ toolsets are requested because the
            # x64 runner builds x64 and x86.
            - name: Install Windows SDK 28000
              if: startsWith(matrix.os, 'windows')
              uses: ChristopheLav/windows-sdk-install@v1
              with:
                  version-sdk: 28000
                  features: "OptionId.DesktopCPPx64,OptionId.DesktopCPPx86,OptionId.DesktopCPParm64"

            - name: Setup .NET
              uses: actions/setup-dotnet@v4
              with:
                  # The NUKE build project targets net7.0, so the 7.0 runtime has to be installed for
                  # `dotnet run` to launch it. 8.0.x alone is not enough: the runner resolves the
                  # rollforward to net8.0 but the build project's runtimeconfig pins 7.0, and the
                  # run fails with "You must install or update .NET to run this application".
                  dotnet-version: |
                      7.0.x
                      8.0.x

            - name: Configure git
              run: |
                  git config --local user.email "github-actions[bot]@users.noreply.github.com"
                  git config --local user.name "github-actions[bot]"

            # depot_tools' `fetch` is a Python script. 3.10 is what upstream pins, but there is no
            # arm64 build of it for Windows -- the first arm64 release is 3.11.0, and setup-python
            # fails with "The version '3.10' with architecture 'arm64' was not found for Windows"
            # there. Both versions work for depot_tools' purposes, so let each platform take the
            # one it has.
            - uses: actions/setup-python@v5
              with:
                  python-version: ${{ startsWith(matrix.os, 'windows') && '3.11' || '3.10' }}

            # Both Linux legs, which now share the x64 image: the arm64 one cross-compiles, and
            # needs the same headers for the GL and Vulkan backends it links against.
            - name: Extra prerequisites
              if: startsWith(matrix.os, 'ubuntu')
              run: |
                  # The build runs ANGLE's own install-build-deps.sh, which installs the bulk of
                  # what's needed. These are the X11/GL development headers the GL and Vulkan
                  # backends link against, installed up front so a hiccup in that script doesn't
                  # leave the build without them.
                  sudo apt-get update
                  sudo apt-get install -y libx11-xcb-dev libxext-dev libxdamage-dev libgl-dev

            - name: Build ANGLE
              run: ${{ matrix.nuke_invoke }} Angle
              env:
                  SILKNET_EGL_PUBLISH: "1"
                  # The architecture to build, so each job builds exactly one. Without it the build
                  # falls back to whatever the host supports.
                  SILKNET_EGL_TARGET_CPU: ${{ matrix.target_cpu }}

            # The build pushes the binaries it produces, but that push can be rejected -- and this
            # is not hypothetical: the Windows x64 and arm64 legs each built for 45 and 137 minutes,
            # copied their output, and lost it when the commit was refused, having produced
            # perfectly good libraries. Upload them first, so that a failed publish costs the
            # convenience of having them on the branch rather than the build itself. The upload
            # runs as part of this step, so a failure here fails the job.
            - name: Upload binaries
              if: always()
              uses: actions/upload-artifact@v4
              with:
                  name: angle-${{ matrix.runtimes }}
                  # The build crashes out on a rejected push, so on a bad run the build directory is
                  # not there at all -- the step above is where the compiler's output lives.
                  path: |
                      native/Maxine.Silk.OpenGLES.ANGLE.Native/runtimes/${{ matrix.runtimes }}/native/*
                      ${{ runner.temp }}/silkDotNetAngleBuild*/angle_source/out/Release_*/*.dll
                      ${{ runner.temp }}/silkDotNetAngleBuild*/angle_source/out/Release_*/*.so
                      ${{ runner.temp }}/silkDotNetAngleBuild*/angle_source/out/Release_*/*.dylib
                  if-no-files-found: warn
                  overwrite: true

            - name: Verify binaries
              shell: bash
              run: |
                  set -e
                  fail=0
                  for rid in $(echo "${{ matrix.runtimes }}" | tr ',' ' '); do
                      dir="native/Maxine.Silk.OpenGLES.ANGLE.Native/runtimes/$rid/native"
                      if [ ! -d "$dir" ]; then
                          echo "::error::expected output directory $dir does not exist"
                          fail=1
                          continue
                      fi
                      echo "$dir:"
                      ls -la "$dir"
                      for lib in libEGL libGLESv2; do
                          found=$(find "$dir" -maxdepth 1 -iname "$lib.*" | head -1)
                          if [ -z "$found" ]; then
                              echo "::error::$dir is missing a $lib library"
                              fail=1
                          fi
                      done
                  done
                  exit $fail
